<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faruk Demirezen – Site ve Yönetim Paneli</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --accent: #2f7cf6;
      --bg: #0b0b0d;
      --surface: #141417;
      --surface-2: #1b1b1f;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --border: #26262b;
      --bar: 60px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
    a, button { color: inherit; font: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .topbar { height: var(--bar); flex: none; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0 1.2rem; border-bottom: 1px solid var(--border); }
    .back { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }
    .back:hover { color: var(--text); }
    .title { display: flex; align-items: center; gap: 0.6rem; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.1rem; }
    .title i { color: var(--accent); }
    .tabs { display: none; gap: 4px; background: var(--surface); padding: 4px; border-radius: 8px; }
    .tabs button { border: 0; background: transparent; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    .tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--text); }

    .split { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); min-height: 0; }
    .pane { background: var(--bg); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .pane-head { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; padding: 0 1rem; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    .pane-head strong { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; }
    .pane-head strong i { color: var(--accent); width: 16px; text-align: center; }
    .pane-head span { color: var(--text-muted); }
    .pane-head a { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text-muted); font-weight: 500; white-space: nowrap; }
    .pane-head a:hover { color: var(--text); }
    .viewport { position: relative; flex: 1; overflow: hidden; }
    .viewport iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #0f0e0d; }

    @media (max-width: 900px) {
      .title span { display: none; }
      .tabs { display: flex; }
      .split { grid-template-columns: 1fr; }
      .pane:not(.active) { display: none; }
      .pane-head span { display: none; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../../index.html#projects"><i class="fa-solid fa-arrow-left"></i> Projeler</a>
    <h1 class="title"><i class="fa-solid fa-scissors"></i> Faruk Demirezen <span>· Site ve yönetim paneli</span></h1>
    <div class="tabs" role="tablist" aria-label="Görünüm">
      <button type="button" role="tab" aria-selected="true" data-pane="site">Site</button>
      <button type="button" role="tab" aria-selected="false" data-pane="panel">Panel</button>
    </div>
  </div>

  <div class="split">
    <section class="pane active" id="pane-site" aria-label="Müşteri sitesi">
      <div class="pane-head">
        <strong><i class="fa-solid fa-globe"></i> Müşteri sitesi</strong>
        <span>Online randevu</span>
        <a href="../Faruk-Demirezen/index.html" target="_blank" rel="noopener">Tam ekran <i class="fa-solid fa-up-right-from-square"></i></a>
      </div>
      <div class="viewport"><iframe src="../Faruk-Demirezen/index.html" title="Faruk Demirezen müşteri sitesi"></iframe></div>
    </section>
    <section class="pane" id="pane-panel" aria-label="Yönetim paneli">
      <div class="pane-head">
        <strong><i class="fa-solid fa-gauge"></i> Yönetim paneli</strong>
        <span>Demo · örnek veri, işlem kaydedilmez</span>
        <a href="../Faruk-Demirezen/index.html#/admin" target="_blank" rel="noopener">Tam ekran <i class="fa-solid fa-up-right-from-square"></i></a>
      </div>
      <div class="viewport"><iframe src="../Faruk-Demirezen/index.html#/admin" title="Faruk Demirezen yönetim paneli"></iframe></div>
    </section>
  </div>

  <script>
    // Masaüstünde her iframe 1280px genişlikte çizilip bölmeye sığacak şekilde küçültülür;
    // böylece iki taraf da sitenin masaüstü görünümünü gösterir. Dar ekranda gerçek boyutta kalır.
    const DESIGN_WIDTH = 1280;
    function fit() {
      const narrow = matchMedia('(max-width: 900px)').matches;
      document.querySelectorAll('.viewport').forEach(vp => {
        const frame = vp.querySelector('iframe');
        const w = vp.clientWidth, h = vp.clientHeight;
        const scale = narrow ? 1 : Math.min(1, w / DESIGN_WIDTH);
        frame.style.width = (w / scale) + 'px';
        frame.style.height = (h / scale) + 'px';
        frame.style.transform = 'scale(' + scale + ')';
      });
    }
    addEventListener('resize', fit);
    fit();

    document.querySelectorAll('.tabs button').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b === btn)));
      document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + btn.dataset.pane));
      fit();
    }));
  </script>
</body>
</html>
